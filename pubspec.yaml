name: zenith_iptv_player
description: "Play your own IPTV playlists with category and language support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0-0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Video Playback
  video_player: ^2.9.2
  better_player_plus: ^1.0.4
  
  # Networking
  dio: ^5.7.0
  
  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # File Handling
  file_picker: ^8.1.3
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  
  # Monetization
  google_mobile_ads: ^5.2.0
  
  # Utilities
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/


